; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_compat_mode = strict
board_build.filesystem = littlefs
board_build.partitions = WunderClock.csv
build_flags = -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps = 
	adafruit/Adafruit Protomatter@^1.7.1
	adafruit/Adafruit FRAM I2C@^2.0.3
	sparkfun/SparkFun u-blox GNSS v3@^3.1.15
	adafruit/Adafruit BME280 Library@^2.3.0
	tzapu/WiFiManager@^2.0.17
	ropg/ezTime@^0.8.3
	adafruit/RTClib@^2.1.4
	arduino-irremote/IRremote@^4.7.1
	arkhipenko/TaskScheduler@^4.1.1
	bblanchon/ArduinoJson@^7.2.2
	ayushsharma82/ElegantOTA@^4.0.0
